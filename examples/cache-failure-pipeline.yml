name: Cache Failure Save Policy Example

steps:
  - name: Save diagnostics after failure
    run: |
      mkdir -p tmp/failure-cache
      printf "failure diagnostics\n" > tmp/failure-cache/failure.txt
      exit 1
    cache:
      key: demo-failure-cache
      paths:
        - tmp/failure-cache
      save_when: always

  - name: Should not run
    run: echo "This step is skipped after failure"
