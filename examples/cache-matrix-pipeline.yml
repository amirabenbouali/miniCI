name: Cache Matrix Example
concurrency: 2

matrix:
  RUBY:
    - "3.1"
    - "3.2"

steps:
  - name: Install dependency per Ruby
    run: bash scripts/cache_dependency_demo.sh
    cache:
      key: demo-dependencies-ruby-${{ env.MATRIX_RUBY }}-${{ checksum("examples/cache.lock") }}
      restore_keys:
        - demo-dependencies-ruby-${{ env.MATRIX_RUBY }}-
        - demo-dependencies-
      paths:
        - tmp/dependencies

