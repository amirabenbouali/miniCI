name: Environment Example

env:
  APP_ENV: test
  LOG_LEVEL: info
  SHARED_VALUE: global

steps:
  - name: Print global variables
    run: bash scripts/print_env.sh

  - name: Override one variable
    run: ruby -e 'puts ENV.fetch("SHARED_VALUE")'
    timeout: 5
    env:
      SHARED_VALUE: step
      FEATURE_FLAG: enabled
