name: Feature request
description: Suggest a focused Mini CI improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or pain point should this solve?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example configuration or command
      render: yaml
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility concerns
      description: Mention CLI, YAML, plugin API, dashboard, or packaging compatibility if relevant.
